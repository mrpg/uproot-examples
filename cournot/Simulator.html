<button class="btn-outline theme-secondary btn-sm mt-3" type="button" data-bs-toggle="collapse" data-bs-target="#simCollapse">
    Try the simulator
</button>

<div class="collapse mt-3" id="simCollapse">
    <div class="card card-body" x-data="{
        me: '', other: '',
        get ready() { return this.me !== '' && this.other !== '' },
        get total() { return this.ready ? Number(this.me) + Number(this.other) : null },
        get price() { return this.ready ? Math.max(0, 100 - this.total) : null },
        get myEarnings() { return this.ready ? this.price * Number(this.me) : null },
        get otherEarnings() { return this.ready ? this.price * Number(this.other) : null }
    }">
        <div class="row g-3 align-items-center mb-5">
            <div class="col-auto">
                <label class="col-form-label fw-semibold">Your units</label>
            </div>
            <div class="col-auto">
                <input class="form-control" type="number" x-model="me" min="0" max="100" style="width: 6rem;">
            </div>
            <div class="col-auto ms-5">
                <label class="col-form-label fw-semibold">Other’s units</label>
            </div>
            <div class="col-auto">
                <input class="form-control" type="number" x-model="other" min="0" max="100" style="width: 6rem;">
            </div>
        </div>
        <hr class="my-3">
        <div class="row text-center">
            <div class="col">
                <div class="fg-3 small">Total units</div>
                <div class="fs-lg fw-bold" x-text="ready ? total : '—'"></div>
            </div>
            <div class="col">
                <div class="fg-3 small">Price</div>
                <div class="fs-lg fw-bold" x-text="ready ? '$' + price : '—'"></div>
            </div>
            <div class="col">
                <div class="fg-3 small">Your earnings</div>
                <div class="fs-lg fw-bold fg-success" x-text="ready ? '$' + myEarnings : '—'"></div>
            </div>
            <div class="col">
                <div class="fg-3 small">Other’s earnings</div>
                <div class="fs-lg fw-bold" x-text="ready ? '$' + otherEarnings : '—'"></div>
            </div>
        </div>
    </div>
</div>
