<button type="button" class="btn-outline theme-secondary btn-sm" data-bs-toggle="dialog" data-bs-target="#simulatorModal">
    Open simulator
</button>

<dialog class="dialog" id="simulatorModal" aria-labelledby="simulatorModalLabel">
    <div class="dialog-header">
        <span class="dialog-title fs-lg" id="simulatorModalLabel">Simulator</span>
        <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
    </div>
    <div class="dialog-body">
        <fieldset class="row mb-5">
            <legend class="sm:col-4 col-form-label pt-0">You</legend>
            <div class="sm:col-8">
                {% for action in player.context.actions %}
                <div class="form-field">
                    <input class="radio" type="radio" name="simMe" id="simMe{{ action }}" value="{{ action }}">
                    <label for="simMe{{ action }}">Action {{ action }}</label>
                </div>
                {% endfor %}
            </div>
        </fieldset>

        <fieldset class="row mb-5">
            <legend class="sm:col-4 col-form-label pt-0">Other participant</legend>
            <div class="sm:col-8">
                {% for action in player.context.actions %}
                <div class="form-field">
                    <input class="radio" type="radio" name="simOther" id="simOther{{ action }}" value="{{ action }}">
                    <label for="simOther{{ action }}">Action {{ action }}</label>
                </div>
                {% endfor %}
            </div>
        </fieldset>

        <hr>

        <div class="row">
            <div class="col-6 text-center">
                <div class="fg-3 small">Your earnings</div>
                <div class="fs-xl fw-bold" id="simMyPayoff">&mdash;</div>
            </div>

            <div class="col-6 text-center">
                <div class="fg-3 small">Other's earnings</div>
                <div class="fs-xl fw-bold" id="simOtherPayoff">&mdash;</div>
            </div>
        </div>
    </div>
    <div class="dialog-footer">
        <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Close</button>
    </div>
</dialog>

<script>
    uproot.onReady(() => {
        const actions = {{ player.context.actions_json | safe }};
        const matrix = {{ player.context.matrix_json | safe }};

        function update() {
            const me = document.querySelector('input[name="simMe"]:checked');
            const other = document.querySelector('input[name="simOther"]:checked');
            if (!me || !other) {
                I("simMyPayoff").textContent = "—";
                I("simOtherPayoff").textContent = "—";
                return;
            }
            const i = actions.indexOf(me.value);
            const j = actions.indexOf(other.value);
            const cell = matrix[i][j];
            I("simMyPayoff").textContent = cell[0];
            I("simOtherPayoff").textContent = cell[1];
        }

        document.querySelectorAll('input[name="simMe"], input[name="simOther"]').forEach(r => {
            r.addEventListener("change", update);
        });
    });
</script>
