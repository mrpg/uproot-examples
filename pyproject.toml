[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uproot-project"
version = "0.1.0"
description = "An uproot-based web application for behavioral science experiments"
readme = "README.md"
license = "0BSD"
requires-python = ">=3.13"
dependencies = [
    "uproot-science @ git+https://github.com/mrpg/uproot.git@main",
    "anthropic",
    "audioop-lts",
    "black",
    "find-eq @ git+https://github.com/mrpg/find-eq.git@4574b1ebb1c66a229202ffbccd7cb6230e0d887f",
    "isort",
    "mini-exchange @ git+https://github.com/mrpg/mini-exchange.git@63e1501ff9dc2a8f9b1f07f4d73a0d9f77a7cc04",
    "mypy",
    "openai",
    "pillow",
    "pre-commit",
    "pydub",
    "ruff",
    "schwifty",
]

[tool.setuptools]
packages = []

[tool.black]
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
disallow_any_generics = true
strict_equality = true
strict = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
no_implicit_reexport = true
extra_checks = true

[tool.ruff.lint]
ignore = ["F403", "F405", "RUF012", "C408", "BLE001"]

[tool.isort]
profile = "black"
