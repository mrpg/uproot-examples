{% if deployment.PUBLIC_DEMO %}

{% if deployment.ORIGIN == "https://demo.uproot.science" %}

<script>
    const headsUp = document.createElement("div");
    I("uproot-main").prepend(headsUp);

    headsUp.className = "bg-muted-uproot border-start border-uproot-light callout mb-7 px-5 py-5 fg-uproot";
    headsUp.setAttribute("role", "status");
    headsUp.innerHTML =
        `<div class="align-items-start d-flex gap-5">
            <i class="bi bi-info-circle flex-shrink-0 fs-lg lh-1 fg-uproot" aria-hidden="true" style="margin-top: 0.345rem;"></i>
            <div class="lh-md">
                <div class="fw-bold pt-1 fg-uproot">Public demo server</div>
                <div class="mb-1 mt-3 small fg-2">
                    This is a public demo of
                    <a class="fg-uproot link-subtle" href="https://uproot.science/">uproot</a>,
                    an open-source framework for deploying behavioral experiments and surveys in the social sciences.
                    Content on this server is public and cannot be perfectly controlled.
                    Please
                    <a class="fg-uproot link-subtle" href="https://uproot.science/legal/">report objectionable material</a>.
                    The server restarts regularly and is located in Europe, which may affect performance depending on your location.
                    <a class="fg-uproot link-subtle" href="https://demo-au.uproot.science/">Alternative server (hosted in Australia).</a>
                    <a class="fg-uproot link-subtle" href="https://github.com/mrpg/uproot-examples">View source code.</a>
                </div>
            </div>
        </div>`;
</script>
