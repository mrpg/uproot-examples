{% if player is not none and len(player.page_order) > 0 %}
    {% set _local_progress = max(round(100 * ((player.show_page + 1) / len(player.page_order))), 0) %}
    <div
        class="progress fixed-top rounded-0"
        style="--bs-progress-height: 8px;"
        role="progressbar"
        aria-label="Study progress"
        aria-valuenow="{{ _local_progress }}"
        aria-valuemin="0"
        aria-valuemax="100">
        <div class="progress-bar" style="width: {{ _local_progress }}%"></div>
    </div>
{% endif %}
